{% extends "base.html" %}

{% block title %}404 | Not Found{% endblock %}

{% block content %}
<section class="min-h-screen flex flex-col justify-center items-center text-center px-8">
    <p class="text-xs text-gray-600 mb-4"><span style="color:#00ff41;">></span> error_code: 404</p>
    <h1 class="text-8xl font-black text-white mb-4">404</h1>
    <p class="text-gray-600 text-sm mb-2">// Page not found</p>
    <p class="text-gray-600 text-sm mb-12">// The path you're looking for doesn't exist</p>
    <a href="/"
       class="px-8 py-3 text-sm font-black transition inline-block hover:opacity-90"
       style="background:#00ff41; color:#0a0a0a;">
        $ ./go_home
    </a>
</section>
{% endblock %}
